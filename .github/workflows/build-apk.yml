name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log
      - name: Show key build errors
        if: failure()
        run: |
          echo "=== FIRST ERRORS AND FAILURE SUMMARY ==="
          grep -n -m 25 -E 'What went wrong|FAILURE:|Could not|Plugin \[|error:|Execution failed|Caused by:' build.log || true
          echo "=== LOG START ==="
          head -n 110 build.log || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Kays-Handwriting-Studio-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
